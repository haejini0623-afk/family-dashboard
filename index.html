<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 520px at 50% -12%, #FFF6D8 0%, rgba(255,246,216,0) 62%),
      radial-gradient(700px 420px at 100% 100%, #FBEFE4 0%, rgba(251,239,228,0) 60%),
      linear-gradient(180deg, #FBF3E2 0%, #F7EEDC 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: none;
  }
  * { -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; }
  input, textarea, select { font-family: inherit; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .press { transition: transform .14s ease, box-shadow .18s ease, background-color .18s ease; }
  .press:active { transform: scale(.965); }
  @keyframes popIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pop-in { animation: popIn .18s cubic-bezier(.22,1.2,.4,1) both; }
  @keyframes sheetUp { from { transform: translateY(26px); opacity: .4; } to { transform: translateY(0); opacity: 1; } }
  .sheet-up { animation: sheetUp .24s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .fade-in { animation: fadeIn .18s ease both; }
  @keyframes softPulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
  .soft-pulse { animation: softPulse 1.6s ease-in-out infinite; }
  .stamp-ring { box-shadow: 0 0 0 3px #FFFDF4, 0 0 0 5.5px #A9CEF0, 0 4px 10px rgba(120,160,200,.25); }
  .sheen { background-image: linear-gradient(145deg, rgba(255,255,255,.9), rgba(255,255,255,.35)); }
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script>
  /* JSX를 클래식 런타임(React.createElement)으로 바꿔 주는 프리셋.
     기본 react 프리셋은 자동 런타임이라 브라우저에서 그대로 실행되지 않는다. */
  if (window.Babel) {
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
    });
  }
</script>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef } = React;

/* ────────────────────────── 기본 상수 ────────────────────────── */
const KEY = 'family-dashboard:v1';
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
/* 주간 일정은 월요일부터 — weekDates()와 같은 순서(0=월 … 6=일) */
const SCHED_DAYS = [
  { key: 'mon', label: '월' },
  { key: 'tue', label: '화' },
  { key: 'wed', label: '수' },
  { key: 'thu', label: '목' },
  { key: 'fri', label: '금' },
  { key: 'sat', label: '토' },
  { key: 'sun', label: '일' },
];
const FAMILY_WHO = '가족';
/* 일정 시간 빠른 선택 — 아이폰 시계 휠을 열지 않고도 한 번에 고를 수 있게 */
const SCHED_TIME_PRESETS = ['09:00', '12:00', '15:00', '18:00'];
/* 예전 기록이 'mon'·'tue' 같은 이름으로 저장돼 있어도 받아 준다 */
const schedDayIndex = (v) => {
  if (typeof v === 'number' && v >= 0 && v <= 6) return Math.round(v);
  const i = SCHED_DAYS.findIndex((d) => d.key === v);
  return i >= 0 ? i : 0;
};
/* '1530'·'15:30'·'930'을 '15:30'·'09:30'으로. 비면 ''(종일), 잘못된 시각이면 null */
const schedTime = (raw) => {
  const digits = String(raw == null ? '' : raw).replace(/[^0-9]/g, '');
  if (!digits) return '';
  const d = digits.slice(0, 4);
  const h = d.length <= 2 ? num(d) : num(d.slice(0, d.length - 2));
  const m = d.length <= 2 ? 0 : num(d.slice(-2));
  if (h > 23 || m > 59) return null;
  return `${pad2(h)}:${pad2(m)}`;
};
const pad2 = (n) => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const won = (n) => (Number(n) || 0).toLocaleString('ko-KR');
const num = (v) => {
  const n = Number(String(v == null ? '' : v).replace(/[^0-9-]/g, ''));
  return isNaN(n) ? 0 : n;
};
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = (p) => `${p}${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

const MEMBERS = [
  { id: '승우', name: '승우', subtitle: '피구왕 승우와 함께', avatar: '🧑🏻‍🔬', char: 'hachiware', tint: '#EAF7EE', edge: '#CFEBD9', ink: '#3E6B4C', kid: true },
  { id: '은우', name: '은우', subtitle: '귀염둥이 은우와 함께', avatar: '👧🏻', char: 'chiikawa', tint: '#FDEEF3', edge: '#F7D7E2', ink: '#A4526C', kid: true },
  { id: '서우', name: '서우', subtitle: '스파이더맨 서우와 함께', avatar: '🦸🏻‍♂️', char: 'usagi', tint: '#EDF3FE', edge: '#D4E3FB', ink: '#456A9C', kid: true },
  { id: '엄마', name: '엄마', subtitle: '수영하는 엄마', avatar: '🏊‍♀️', char: 'momonga', tint: '#FEF3E4', edge: '#F8DFBE', ink: '#9A6B34', kid: false },
  { id: '아빠', name: '아빠', subtitle: '다정한 아빠', avatar: '👨🏻', char: 'kurimanju', tint: '#F3F0FD', edge: '#E1DAF8', ink: '#5D5192', kid: false },
];
const M = Object.fromEntries(MEMBERS.map((m) => [m.id, m]));
const KIDS = MEMBERS.filter((m) => m.kid).map((m) => m.id);
const DEFAULT_CHARS = Object.fromEntries(MEMBERS.map((m) => [m.id, m.char]));

/* ── 먼작귀 캐릭터 모듈 시작 ── */
/* ────────────────────────── 먼작귀 캐릭터 (직접 그린 SVG) ────────────────────────── */
const INK = '#2C221E';
const BLUSH_PINK = '#F494AB';

const CHARACTERS = [
  { id: 'chiikawa', name: '치이카와', note: '동글동글 하얀 햄스터' },
  { id: 'hachiware', name: '하치와레', note: '파란 무늬 하얀 고양이' },
  { id: 'usagi', name: '우사기', note: '야하! 노란 토끼' },
  { id: 'momonga', name: '모몽가', note: '하늘색 꼬리 날다람쥐' },
  { id: 'kurimanju', name: '쿠리만쥬', note: '밤 모자 쓴 만쥬' },
  { id: 'rakko', name: '라코', note: '이마 흉터 수달' },
  { id: 'shisa', name: '시사', note: '주황 갈기 사자' },
  { id: 'kani', name: '카니', note: '분홍 게 머리띠' },
];
const CHAR = Object.fromEntries(CHARACTERS.map((c) => [c.id, c]));

const CHAT_STICKERS = [
  { id: 'hachiware-cry', char: 'hachiware', mood: 'cry', label: '하치와레 눈물', short: '눈물', caption: '왈칵…' },
  { id: 'chiikawa-cheer', char: 'chiikawa', mood: 'cheer', label: '치이카와 응원', short: '응원', caption: '힘내자!' },
  { id: 'usagi-yaha', char: 'usagi', mood: 'grin', label: '우사기 야하!', short: '야하!', caption: '야하—!' },
  { id: 'momonga-love', char: 'momonga', mood: 'love', label: '모몽가 귀여워', short: '귀여워', caption: '귀여워~' },
  { id: 'kurimanju-cheers', char: 'kurimanju', mood: 'happy', label: '쿠리만쥬 건배', short: '건배', caption: '짠!' },
  { id: 'rakko-best', char: 'rakko', mood: 'cheer', label: '라코 최고', short: '최고', caption: '최고야' },
];
const stickerOf = (id) => CHAT_STICKERS.find((s) => s.id === id) || null;

/* 가족 구성원이 지금 쓰는 캐릭터 (설정에서 바꾼 값 → 기본값 순서) */
const charOfMember = (chars, id) => {
  const m = M[id] || {};
  const pick = (chars && chars[id]) || m.char;
  return pick && CHAR[pick] ? pick : null;
};

const charName = (id) => (CHAR[id] ? CHAR[id].name : '');

const heartPath = (x, y, s) =>
  `M${x} ${y + s * 0.95} C${x - s * 1.45} ${y - s * 0.05} ${x - s * 0.85} ${y - s * 1.2} ${x} ${y - s * 0.35} C${x + s * 0.85} ${y - s * 1.2} ${x + s * 1.45} ${y - s * 0.05} ${x} ${y + s * 0.95} Z`;
const starPath = (x, y, s) =>
  `M${x} ${y - s} L${x + s * 0.3} ${y - s * 0.3} L${x + s} ${y} L${x + s * 0.3} ${y + s * 0.3} L${x} ${y + s} L${x - s * 0.3} ${y + s * 0.3} L${x - s} ${y} L${x - s * 0.3} ${y - s * 0.3} Z`;

const eyeMood = (mood, base) =>
  mood === 'happy' ? 'happy' : mood === 'cry' ? 'cry' : mood === 'love' ? 'love' : (base || 'idle');
const mouthMood = (mood, base) =>
  mood === 'happy' ? 'smile'
    : mood === 'cry' ? 'wavy'
      : mood === 'cheer' ? 'open'
        : mood === 'grin' ? 'grin'
          : (base || 'omega');

/* 반짝이는 눈 — 기분에 따라 감은 눈·하트 눈·눈물 눈 */
function CEye({ x, y, mood = 'idle', size = 1 }) {
  const rx = 5.0 * size;
  const ry = 5.9 * size;
  if (mood === 'happy') {
    return <path d={`M${x - 4.8 * size} ${y + 2 * size} Q${x} ${y - 4.6 * size} ${x + 4.8 * size} ${y + 2 * size}`} fill="none" stroke={INK} strokeWidth={2.6 * size} strokeLinecap="round" />;
  }
  if (mood === 'cry') {
    return <path d={`M${x - 4.6 * size} ${y - 1.4 * size} Q${x} ${y + 4.6 * size} ${x + 4.6 * size} ${y - 1.4 * size}`} fill="none" stroke={INK} strokeWidth={2.6 * size} strokeLinecap="round" />;
  }
  if (mood === 'love') {
    return <path d={heartPath(x, y, 5.6 * size)} fill="#EF7189" stroke={INK} strokeWidth={1.5 * size} strokeLinejoin="round" />;
  }
  return (
    <g>
      <ellipse cx={x} cy={y} rx={rx} ry={ry} fill={INK} />
      <circle cx={x - rx * 0.34} cy={y - ry * 0.36} r={rx * 0.4} fill="#FFFFFF" />
      <circle cx={x + rx * 0.34} cy={y + ry * 0.42} r={rx * 0.19} fill="#FFFFFF" opacity="0.9" />
      {mood === 'serious' ? (
        <path d={`M${x - rx * 0.95} ${y - ry * 0.55} L${x + rx * 0.95} ${y - ry * 0.85}`} stroke={INK} strokeWidth={2.2 * size} strokeLinecap="round" />
      ) : null}
    </g>
  );
}

/* 볼 — 분홍빛 대각선 세 줄 */
function CCheek({ x, y, size = 1 }) {
  return (
    <g stroke={BLUSH_PINK} strokeWidth={2 * size} strokeLinecap="round" opacity="0.92">
      <line x1={x} y1={y + 2.8 * size} x2={x + 3.2 * size} y2={y - 2.6 * size} />
      <line x1={x + 4 * size} y1={y + 3.6 * size} x2={x + 7.2 * size} y2={y - 1.8 * size} />
      <line x1={x + 8 * size} y1={y + 4 * size} x2={x + 11.2 * size} y2={y - 1.4 * size} />
    </g>
  );
}

/* 입 — ω, 웃음, 벌린 입, 야하! 미소, 시무룩 */
function CMouth({ x = 50, y = 64, mood = 'omega', size = 1 }) {
  const u = size * 1.34;
  const sw = 2.7 * u;
  if (mood === 'open') {
    return (
      <g>
        <path d={`M${x - 6.3 * u} ${y - 1.4 * u} Q${x} ${y + 10.5 * u} ${x + 6.3 * u} ${y - 1.4 * u} Z`} fill="#D06A79" stroke={INK} strokeWidth={sw} strokeLinejoin="round" />
        <path d={`M${x - 2.4 * u} ${y + 4.8 * u} q${2.4 * u} ${3.2 * u} ${4.8 * u} 0`} fill="#F8B0BE" stroke="none" />
      </g>
    );
  }
  if (mood === 'grin') {
    return (
      <g>
        <path d={`M${x - 9 * u} ${y - 3 * u} Q${x} ${y + 14 * u} ${x + 9 * u} ${y - 3 * u} Q${x} ${y + 2 * u} ${x - 9 * u} ${y - 3 * u} Z`} fill="#C9586B" stroke={INK} strokeWidth={sw} strokeLinejoin="round" />
        <path d={`M${x - 4.6 * u} ${y + 3.4 * u} q${4.6 * u} ${4.2 * u} ${9.2 * u} 0`} fill="#F8B0BE" stroke="none" />
      </g>
    );
  }
  if (mood === 'smile') {
    return <path d={`M${x - 5.6 * u} ${y - 1.2 * u} q${5.6 * u} ${6.6 * u} ${11.2 * u} 0`} fill="none" stroke={INK} strokeWidth={sw} strokeLinecap="round" />;
  }
  if (mood === 'wavy') {
    return <path d={`M${x - 6 * u} ${y} q${3 * u} ${-3.4 * u} ${6 * u} 0 q${3 * u} ${3.4 * u} ${6 * u} 0`} fill="none" stroke={INK} strokeWidth={sw} strokeLinecap="round" />;
  }
  if (mood === 'flat') {
    return <path d={`M${x - 5 * u} ${y} q${2.5 * u} ${-2.6 * u} ${5 * u} 0 q${2.5 * u} ${2.6 * u} ${5 * u} 0`} fill="none" stroke={INK} strokeWidth={sw} strokeLinecap="round" />;
  }
  return <path d={`M${x - 5.2 * u} ${y} q${2.6 * u} ${4.4 * u} ${5.2 * u} 0 q${2.6 * u} ${4.4 * u} ${5.2 * u} 0`} fill="none" stroke={INK} strokeWidth={sw} strokeLinecap="round" />;
}

/* 기분에 따라 붙는 장식 — 눈물, 하트, 반짝이, 부르르 */
function MoodFlair({ mood }) {
  if (mood === 'cry') {
    return (
      <g>
        <path d="M34 56 q-3.4 6.4 0.4 9 q4.2 -2 -0.4 -9 z" fill="#8FD2F0" stroke="#5FAFD4" strokeWidth="1.5" strokeLinejoin="round" />
        <path d="M66 56 q3.4 6.4 -0.4 9 q-4.2 -2 0.4 -9 z" fill="#8FD2F0" stroke="#5FAFD4" strokeWidth="1.5" strokeLinejoin="round" />
        <circle cx="29" cy="72" r="2.1" fill="#8FD2F0" stroke="#5FAFD4" strokeWidth="1.2" />
        <circle cx="72" cy="75" r="1.8" fill="#8FD2F0" stroke="#5FAFD4" strokeWidth="1.2" />
      </g>
    );
  }
  if (mood === 'love') {
    return (
      <g>
        <path d={heartPath(19, 30, 5.4)} fill="#F58BA3" stroke="#DA6880" strokeWidth="1.5" strokeLinejoin="round" />
        <path d={heartPath(84, 44, 4)} fill="#F58BA3" stroke="#DA6880" strokeWidth="1.4" strokeLinejoin="round" />
        <path d={heartPath(78, 76, 3)} fill="#FBC3CF" stroke="#DA6880" strokeWidth="1.2" strokeLinejoin="round" />
      </g>
    );
  }
  if (mood === 'cheer') {
    return (
      <g fill="#F8C959" stroke="#DDA02C" strokeWidth="1.4" strokeLinejoin="round">
        <path d={starPath(15, 33, 7.5)} />
        <path d={starPath(86, 40, 5.6)} />
        <path d={starPath(80, 78, 4.4)} />
      </g>
    );
  }
  if (mood === 'grin') {
    return (
      <g stroke="#E79494" strokeWidth="2.6" strokeLinecap="round">
        <path d="M15 45 l-5.5 -3" />
        <path d="M14 53 l-6 0" />
        <path d="M85 45 l5.5 -3" />
        <path d="M86 53 l6 0" />
      </g>
    );
  }
  return null;
}

function ChiikawaArt({ mood }) {
  return (
    <g>
      <g fill="#FFFFFF" stroke={INK} strokeWidth="3.2" strokeLinejoin="round" strokeLinecap="round">
        <circle cx="29" cy="32" r="9" />
        <circle cx="71" cy="32" r="9" />
        <ellipse cx="50" cy="55" rx="29" ry="25.5" />
      </g>
      <CEye x={39.5} y={52} mood={eyeMood(mood)} size={0.95} />
      <CEye x={60.5} y={52} mood={eyeMood(mood)} size={0.95} />
      <CCheek x={29} y={62} />
      <CCheek x={56.5} y={62} />
      <CMouth x={50} y={63} mood={mouthMood(mood)} size={0.94} />
    </g>
  );
}

function HachiwareArt({ mood }) {
  return (
    <g>
      <g fill="#FFFFFF" stroke={INK} strokeWidth="3.2" strokeLinejoin="round" strokeLinecap="round">
        <path d="M25.5 40 L31 14 L46 27 Z" />
        <path d="M74.5 40 L69 14 L54 27 Z" />
        <ellipse cx="50" cy="55" rx="29" ry="25.5" />
      </g>
      <path d="M31 32 L33.5 21 L40 27.5 Z" fill="#9CC9E9" />
      <path d="M69 32 L66.5 21 L60 27.5 Z" fill="#9CC9E9" />
      <path d="M21.4 52.5 C21.8 31 33.5 20.8 50 20.8 C66.5 20.8 78.2 31 78.6 52.5 C72 50 66.6 45.4 63.4 38.6 C60.2 45.2 55.4 48.6 50 48.6 C44.6 48.6 39.8 45.2 36.6 38.6 C33.4 45.4 28 50 21.4 52.5 Z" fill="#9CC9E9" stroke={INK} strokeWidth="2.8" strokeLinejoin="round" />
      <CEye x={40} y={56} mood={eyeMood(mood)} size={0.92} />
      <CEye x={60} y={56} mood={eyeMood(mood)} size={0.92} />
      <CCheek x={28} y={65} />
      <CCheek x={55.5} y={65} />
      <CMouth x={50} y={65.5} mood={mouthMood(mood)} size={0.86} />
    </g>
  );
}

function UsagiArt({ mood }) {
  return (
    <g>
      <g fill="#FBF0C9" stroke={INK} strokeWidth="3.2" strokeLinejoin="round" strokeLinecap="round">
        <rect x="30.5" y="6" width="11.5" height="38" rx="5.75" />
        <rect x="58" y="6" width="11.5" height="38" rx="5.75" />
        <ellipse cx="50" cy="57" rx="28.5" ry="25" />
      </g>
      <rect x="33.6" y="11" width="5.4" height="25" rx="2.7" fill="#F6C6CE" />
      <rect x="61.1" y="11" width="5.4" height="25" rx="2.7" fill="#F6C6CE" />
      <CEye x={41} y={53} mood={eyeMood(mood)} size={0.9} />
      <CEye x={59} y={53} mood={eyeMood(mood)} size={0.9} />
      <CCheek x={28} y={63} />
      <CCheek x={55} y={63} />
      <CMouth x={50} y={62.5} mood={mouthMood(mood, 'grin')} size={0.74} />
    </g>
  );
}

function MomongaArt({ mood }) {
  return (
    <g>
      <path d="M62 80 C82 86 99 71 96 53 C93 35 76 26 65 36 C55 45 60 58 70 58 C78 58 82 50 76 45" fill="#CFE9F7" stroke={INK} strokeWidth="3.2" strokeLinejoin="round" />
      <path d="M77 71 C88 69 92 59 89 49" fill="none" stroke="#B7DBF0" strokeWidth="2.2" strokeLinecap="round" />
      <path d="M70 44 C73 41 77 41 79 43" fill="none" stroke="#B7DBF0" strokeWidth="2" strokeLinecap="round" />
      <g fill="#FFFFFF" stroke={INK} strokeWidth="3.2" strokeLinejoin="round" strokeLinecap="round">

/* 저장된 모양이 조금 달라도 화면이 깨지지 않게 기본값과 합쳐 준다 */
function normalizeState(p) {
  const def = makeDefault();
  const s = p && typeof p === 'object' ? p : {};
  return {
    ...def,
    ...s,
    settings: { ...def.settings, ...(s.settings || {}) },
    money: { ...def.money, ...(s.money || {}) },
    stamps: { ...def.stamps, ...(s.stamps || {}) },
    studyLog: { ...def.studyLog, ...(s.studyLog || {}) },
    /* 서버 기록에 taskLog가 아직 없으면 빈 값으로 시작한다 (기존 기록은 그대로 둔다) */
    taskLog: { ...def.taskLog, ...(s.taskLog || {}) },
    characters: { ...def.characters, ...(s.characters || {}) },
    mission: { ...def.mission, ...(s.mission || {}) },
    tasks: Array.isArray(s.tasks) ? s.tasks : def.tasks,
    study: Array.isArray(s.study) ? s.study : def.study,
    chats: Array.isArray(s.chats) ? s.chats : def.chats,
    /* 서버 기록에 schedules가 아직 없으면 빈 목록으로 시작한다 (기존 기록은 그대로 둔다) */
    schedules: (Array.isArray(s.schedules) ? s.schedules : [])
      .filter((it) => it && typeof it === 'object' && String(it.title == null ? '' : it.title).trim())
      .map((it, i) => ({
        id: it.id ? String(it.id) : `sc${i}`,
        day: schedDayIndex(it.day),
        owner: it.owner === FAMILY_WHO || M[it.owner] ? it.owner : FAMILY_WHO,
        time: schedTime(it.time) || '',
        title: String(it.title).trim(),
        memo: it.memo ? String(it.memo) : '',
      })),
  };
}

function loadState() {
  try {
    const raw = window.localStorage.getItem(KEY);
    if (!raw) return makeDefault();
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    return makeDefault();
  }
}

/* 고정 항목은 매일 아침 다시 열린다 */
function rolloverState(s) {
  const today = dkey();
  if (!s || s.lastRollover === today) return s;
  return {
    ...s,
    study: (s.study || []).map((it) => (it.pinned ? { ...it, done: false } : it)),
    lastRollover: today,
  };
}

function saveState(s) {
  try {
    window.localStorage.setItem(KEY, JSON.stringify(s));
  } catch (e) {
    /* 사생활 보호 모드 등 저장이 막힌 환경에서는 조용히 넘어간다 */
  }
}

  syncing: { dot: '#E8B448', ring: 'rgba(232,180,72,0.24)', label: '저장하는 중…' },
  ready: { dot: '#E8B448', ring: 'rgba(232,180,72,0.24)', label: '동기화 준비됨' },
  starting: { dot: '#D8C6A8', ring: 'rgba(216,198,168,0.26)', label: '연결 중…' },
  offline: { dot: '#D69F86', ring: 'rgba(214,159,134,0.26)', label: '동기화를 기다리는 중' },
};
const syncTone = (sync) => SYNC_TONE[(sync && sync.status) || 'starting'] || SYNC_TONE.starting;

function sharedSnapshot(s) {
  const out = {};
  Object.keys(s || {}).forEach((k) => {
    if (LOCAL_ONLY.indexOf(k) < 0) out[k] = s[k];
  });
  return out;
}

/* 이 기기에서만 쓰는 값 — 채팅에서 고른 내 이름과 '이 기기 잠금' */
function loadDevice() {
  const def = { chatAs: '엄마', chatLocked: false };
  try {
    const raw = window.localStorage.getItem(DEVICE_KEY);
    const p = raw ? JSON.parse(raw) || {} : {};
    if (p.chatLocked == null) {
      try {
        const legacy = JSON.parse(window.localStorage.getItem(KEY) || '{}') || {};
        if (legacy.chatLock != null) p.chatLocked = !!legacy.chatLock;
      } catch (e) { /* 무시 */ }
    }
    return {
      chatAs: MEMBERS.some((m) => m.id === p.chatAs) ? p.chatAs : def.chatAs,
      chatLocked: !!p.chatLocked,
    };
  } catch (e) {
    return def;
  }
}

function saveDevice(d) {
  try {
    window.localStorage.setItem(DEVICE_KEY, JSON.stringify(d));
  } catch (e) {
    /* 저장이 막힌 환경에서는 이번 화면에서만 기억한다 */
  }
}

function useFamilySync(state, setState, stateRef) {
  const [sync, setSync] = useState({ status: 'starting', label: SYNC_TONE.starting.label });
  const clientRef = useRef(null);
  const liveRef = useRef(false);
  const aliveRef = useRef(true);
  const sentRef = useRef('');
  const timerRef = useRef(null);
  /* 서버의 가족 기록을 처음 읽기 전에는 올리지 않는다 (다른 기기 기록을 덮어쓰지 않도록) */
  const readyRef = useRef(false);

  const say = (status, label) => {
    if (!aliveRef.current) return;
    setSync((s) => (s.status === status && s.label === label ? s : { status, label }));
  };
  const settle = () => (liveRef.current ? say('live', SYNC_TONE.live.label) : say('ready', SYNC_TONE.ready.label));

  /* 다른 기기에서 올라온 가족 기록을 화면에 반영한다 */
  const applyRemote = (raw) => {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return false;
    const meta = raw.__sync;
    if (meta && meta.c === CLIENT_ID) return false;
    const clean = sharedSnapshot(raw);
    if (!Object.keys(clean).length) return false;
    const next = rolloverState(normalizeState(clean));
    const serial = JSON.stringify(sharedSnapshot(next));
    if (serial === sentRef.current) return false;
    sentRef.current = serial;
    setState(next);
    return true;
  };

  /* 이 기기의 가족 기록을 서버에 올린다 */
  const pushNow = async (snapshot, force) => {
    const client = clientRef.current;
    if (!client || !aliveRef.current) return;
    if (!readyRef.current) return;
    const base = sharedSnapshot(snapshot || stateRef.current || {});
    const serial = JSON.stringify(base);
    if (!force && serial === sentRef.current) return;
    try {
      say('syncing', SYNC_TONE.syncing.label);
      const res = await client.from(SYNC_TABLE).upsert(
        {
          id: SYNC_ROW,
          data: { ...base, __sync: { c: CLIENT_ID, r: Date.now(), t: new Date().toISOString() } },
          updated_at: new Date().toISOString(),
        },
        { onConflict: 'id' }
      );
      if (!aliveRef.current) return;
      if (res && res.error) {
        say('offline', SYNC_TONE.offline.label);
        return;
      }
      sentRef.current = serial;
      settle();
    } catch (e) {
      say('offline', SYNC_TONE.offline.label);
    }
  };

  /* 1) 처음 한 번 서버의 가족 기록을 읽고, 2) 실시간 구독을 연다 */
  useEffect(() => {
    aliveRef.current = true;
    /* 화면 확인용(?nosync=1): 서버를 읽지도 쓰지도 않아 가족 기록을 건드리지 않는다 */
    if (window.location.search.indexOf('nosync=1') >= 0) {
      say('offline', SYNC_TONE.offline.label);
      return () => { aliveRef.current = false; };
    }
    const create = window.supabase && window.supabase.createClient;
    if (!create) {
      say('offline', SYNC_TONE.offline.label);
      return () => { aliveRef.current = false; };
    }
    let client = null;
    try {
      client = create(SYNC_URL, SYNC_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
        realtime: { params: { eventsPerSecond: 4 } },
      });
    } catch (e) {
      say('offline', SYNC_TONE.offline.label);
      return () => { aliveRef.current = false; };
    }
    clientRef.current = client;

    (async () => {
      try {
        const res = await client.from(SYNC_TABLE).select('data, updated_at').eq('id', SYNC_ROW).maybeSingle();
        if (!aliveRef.current) return;
        if (res && res.error) {
          readyRef.current = true;
          say('offline', SYNC_TONE.offline.label);
          return;
        }
        const row = res && res.data;
        readyRef.current = true;
        if (row && row.data && typeof row.data === 'object' && Object.keys(row.data).length) {
          applyRemote(row.data);
          settle();
        } else {
          await pushNow(stateRef.current, true);
        }
      } catch (e) {
        readyRef.current = true;
        say('offline', SYNC_TONE.offline.label);
      }
    })();

    let channel = null;
    try {
      channel = client
        .channel(`family_state_${CLIENT_ID}`)
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: SYNC_TABLE, filter: `id=eq.${SYNC_ROW}` },
          (payload) => {
            const row = payload && payload.new;
            if (row && row.data) applyRemote(row.data);
          }
        )
        .subscribe((status) => {
          if (!aliveRef.current) return;
          if (status === 'SUBSCRIBED') {
            liveRef.current = true;
            say('live', SYNC_TONE.live.label);
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
            liveRef.current = false;
            say('offline', SYNC_TONE.offline.label);
          }
        });
    } catch (e) {
      say('offline', SYNC_TONE.offline.label);
    }

    return () => {
      aliveRef.current = false;
      if (timerRef.current) clearTimeout(timerRef.current);
      try {
        if (channel) client.removeChannel(channel);
      } catch (e) { /* 무시 */ }
    };
  }, []);

  /* 이 기기에서 바뀐 내용은 잠깐 모았다가(250ms) 한 번에 올린다 */
  useEffect(() => {
    const serial = JSON.stringify(sharedSnapshot(state));
    if (serial === sentRef.current) return;
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => { pushNow(stateRef.current); }, 250);
  }, [state]);

  return sync;
}

/* 적립 기록 { '2026-11-17': { amount, count } } 의 합계와 하루치 */
function logSum(log) {
  return Object.keys(log || {}).reduce((s, k) => s + (num(log[k] && log[k].amount) || 0), 0);
}
function logDay(log, k) {
  const d = (log && log[k]) || {};
  return { amount: num(d.amount), count: num(d.count) };
}

function moneyOf(state, kid) {
  const m = (state.money && state.money[kid]) || { start: 0, entries: [] };
  const entries = Array.isArray(m.entries) ? m.entries : [];
  const studyLog = (state.studyLog && state.studyLog[kid]) || {};
  const taskLog = (state.taskLog && state.taskLog[kid]) || {};
  const study = logSum(studyLog);
  const task = logSum(taskLog);
  const dep = entries.filter((e) => e.type === '입금').reduce((s, e) => s + num(e.amount), 0);
  const use = entries.filter((e) => e.type === '사용').reduce((s, e) => s + num(e.amount), 0);
  const start = num(m.start);
  return { start, study, task, earned: study + task, dep, use, total: start + study + task + dep - use, entries, studyLog, taskLog };
}

function streakOf(dates) {
  const set = new Set(dates || []);
  const d = new Date();
  if (!set.has(dkey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(dkey(d))) {
    n += 1;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

function weekDates() {
  const t = new Date();
  t.setHours(0, 0, 0, 0);
  const shift = (t.getDay() + 6) % 7;
  const mon = new Date(t);
  mon.setDate(t.getDate() - shift);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

const fmtTime = (iso) => {
  const d = new Date(iso);
  let h = d.getHours();
  const ap = h < 12 ? '오전' : '오후';
  h = h % 12 || 12;
  return `${ap} ${h}:${pad2(d.getMinutes())}`;
};
const fmtDay = (k) => {
  const [y, m, d] = String(k).split('-').map(Number);
  if (!y || !m || !d) return k;
  return `${m}월 ${d}일 (${WEEK[new Date(y, m - 1, d).getDay()]})`;
};

function NumberField({ value, onCommit, className, placeholder, max }) {
  const [v, setV] = useState(String(value == null ? '' : value));
  useEffect(() => { setV(String(value == null ? '' : value)); }, [value]);
  return (
    <input
      type="number"
      inputMode="numeric"
      value={v}
      placeholder={placeholder}
      onChange={(e) => {
        const next = e.target.value.replace(/[^0-9]/g, '');
        setV(next);
        if (next !== '') onCommit(max ? Math.min(num(next), max) : num(next));
      }}
      onBlur={() => setV(String(value == null ? '' : value))}
      className={className}
    />
  );
}

/* ────────────────────────── 타이머 ────────────────────────── */
function useTimer() {
  const [mode, setModeState] = useState('countdown');
  const [minutes, setMinutes] = useState(10);
  const [remaining, setRemaining] = useState(600);
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      if (mode === 'countdown') setRemaining((p) => (p > 0 ? p - 1 : 0));
      else setElapsed((p) => p + 1);
    }, 1000);
    return () => clearInterval(id);
  }, [running, mode]);

  useEffect(() => {
    if (mode === 'countdown' && running && remaining === 0) {
      setRunning(false);
      setFinished(true);
    }
  }, [remaining, running, mode]);

  const setMode = (m) => { setRunning(false); setFinished(false); setModeState(m); };
  const start = () => {
    setFinished(false);
    if (mode === 'countdown' && remaining <= 0) setRemaining(minutes * 60);
    setRunning(true);
  };
  const pause = () => setRunning(false);
  const reset = () => {
    setRunning(false);
    setFinished(false);
    if (mode === 'countdown') setRemaining(minutes * 60);
    else setElapsed(0);
  };
  const preset = (m) => {
    setModeState('countdown');
    setRunning(false);
    setFinished(false);
    setMinutes(m);
    setRemaining(m * 60);
  };
  const applyCustom = (m) => {
    const v = Math.max(1, Math.min(599, num(m)));
    preset(v);
    return v;
  };

  const display = mode === 'countdown'
    ? `${pad2(Math.floor(remaining / 60))}:${pad2(remaining % 60)}`
    : `${pad2(Math.floor(elapsed / 60))}:${pad2(elapsed % 60)}`;

  return { mode, setMode, minutes, remaining, elapsed, running, finished, start, pause, reset, preset, applyCustom, display };
}

/* ────────────────────────── 실시간 날씨 · 미세먼지 (의령군 · Open-Meteo) ────────────────────────── */
/* 열쇠(키) 없이 쓸 수 있는 무료 API 두 개(날씨 예보 · 대기질)를 브라우저에서 직접 불러온다 */
const WX_REGION = '의령군';
const WX_FORECAST_URL = 'https://api.open-meteo.com/v1/forecast?latitude=35.322&longitude=128.261&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=1';
const WX_AIR_URL = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=35.322&longitude=128.261&current=pm10,pm2_5&timezone=Asia%2FSeoul';
const WX_REFRESH_MS = 30 * 60 * 1000;

const orNull = (v) => {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(v);
  return isFinite(n) ? n : null;
};
const firstNum = (v) => (Array.isArray(v) ? orNull(v[0]) : orNull(v));
const pickNum = (v, fallback) => (v === null || v === undefined ? fallback : v);

/* WMO 날씨 코드 → 이모지 · 한글 이름 (비나 눈이 오는 코드인지도 함께 알려 준다) */
function wmoSky(code) {
  const c = orNull(code);
  if (c === null) return { icon: '☀️', label: '맑음', wet: false };
  if (c === 0) return { icon: '☀️', label: '맑음', wet: false };
  if (c === 1) return { icon: '🌤️', label: '대체로 맑음', wet: false };
  if (c === 2) return { icon: '🌤️', label: '구름조금', wet: false };
  if (c === 3) return { icon: '☁️', label: '흐림', wet: false };
  if (c === 45 || c === 48) return { icon: '🌫️', label: '안개', wet: false };
  if (c >= 51 && c <= 57) return { icon: '🌦️', label: '이슬비', wet: true };
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return { icon: '🌧️', label: '비', wet: true };
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return { icon: '🌨️', label: '눈', wet: true };
  if (c >= 95) return { icon: '⛈️', label: '뇌우', wet: true };
  return { icon: '☀️', label: '맑음', wet: false };
}

/* 미세먼지 농도(㎍/㎥) → 좋음 / 보통 / 나쁨 / 매우나쁨 */
function dustLabel(v, kind) {
  const n = orNull(v);
  if (n === null) return null;
  const t = kind === 'pm25' ? [15, 35, 75] : [30, 80, 150];
  if (n <= t[0]) return '좋음';
  if (n <= t[1]) return '보통';
  if (n <= t[2]) return '나쁨';
  return '매우나쁨';
}

/* 오른쪽 한마디 — 마스크 · 우산 · 따뜻하게 · 외출하기 좋아요 */
function weatherTip({ pm10, pm25, wet, pop, temp }) {
  if ((pm10 !== null && pm10 !== undefined && pm10 > 80) || (pm25 !== null && pm25 !== undefined && pm25 > 35)) return '😷 마스크 챙겨요';
  if (wet || (pop !== null && pop !== undefined && pop >= 50)) return '☂️ 우산 챙겨요';
  if (temp !== null && temp !== undefined && temp <= 5) return '🧣 따뜻하게 입어요';
  return '✨ 외출하기 좋아요';
}

/* 의령군 날씨·대기질을 불러온다. 화면을 열 때 한 번, 그 뒤 30분마다, 화면으로 다시 돌아올 때도 새로 고친다 */
function useLiveWeather() {
  const [w, setW] = useState({ ready: false, failed: false, at: null });

  useEffect(() => {
    let alive = true;
    let timer = null;
    let retry = null;

    const getJSON = async (url) => {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const abort = ctrl ? setTimeout(() => ctrl.abort(), 12000) : null;
      try {
        const res = await fetch(url, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        if (abort) clearTimeout(abort);
      }
    };

    const load = async () => {
      const [f, a] = await Promise.all([
        getJSON(WX_FORECAST_URL).catch(() => null),
        getJSON(WX_AIR_URL).catch(() => null),
      ]);
      if (!alive) return;
      if (!f && !a) {
        /* 하나도 못 받아 왔으면 지난 값을 그대로 두고 표시만 바꾼다. 1분 뒤에 한 번 더 시도한다 */
        setW((p) => ({ ...p, failed: true }));
        if (retry) clearTimeout(retry);
        retry = setTimeout(load, 60 * 1000);
        return;
      }
      const cur = (f && f.current) || {};
      const day = (f && f.daily) || {};
      const air = (a && a.current) || {};
      const sky = wmoSky(cur.weather_code);
      setW((p) => ({
        ready: true,
        failed: false,
        at: Date.now(),
        icon: f ? sky.icon : p.icon,
        sky: f ? sky.label : p.sky,
        wet: f ? sky.wet : p.wet,
        temp: f ? orNull(cur.temperature_2m) : p.temp,
        low: f ? firstNum(day.temperature_2m_min) : p.low,
        high: f ? firstNum(day.temperature_2m_max) : p.high,
        pop: f ? firstNum(day.precipitation_probability_max) : p.pop,
        pm10: a ? orNull(air.pm10) : p.pm10,
        pm25: a ? orNull(air.pm2_5) : p.pm25,
      }));
    };

    load();
    timer = setInterval(load, WX_REFRESH_MS);
    const onVisible = () => {
      if (typeof document !== 'undefined' && document.visibilityState === 'visible') load();
    };
    try {
      document.addEventListener('visibilitychange', onVisible);
    } catch (e) { /* 무시 */ }

    return () => {
      alive = false;
      if (timer) clearInterval(timer);
      if (retry) clearTimeout(retry);
      try {
        document.removeEventListener('visibilitychange', onVisible);
      } catch (e) { /* 무시 */ }
    };
  }, []);

  return w;
}

/* ────────────────────────── 헤더 ────────────────────────── */
function WeatherCard({ s, live }) {
  const w = live || {};
  const on = !!w.ready;
  const sky = (on && w.sky) || s.sky;
  const icon = (on && w.icon) || (s.sky.includes('비') ? '🌧️'
    : s.sky.includes('눈') ? '❄️'
    : s.sky.includes('흐림') ? '☁️'
    : s.sky.includes('구름') ? '🌤️'
    : '☀️');
  const temp = Math.round(pickNum(on ? w.temp : null, s.temp));
  const region = on ? WX_REGION : (s.region || WX_REGION);
  const low = Math.round(pickNum(on ? w.low : null, s.low));
  const high = Math.round(pickNum(on ? w.high : null, s.high));
  const dust = (on && dustLabel(w.pm10, 'pm10')) || s.dust;
  const dust2 = (on && dustLabel(w.pm25, 'pm25')) || s.dust2;
  const tip = on
    ? weatherTip({ pm10: w.pm10, pm25: w.pm25, wet: !!w.wet, pop: w.pop, temp: w.temp })
    : `😷 ${s.mask || '마스크 챙겨요'}`;
  const at = on && w.at ? new Date(w.at) : null;
  const caption = at && !w.failed ? `${pad2(at.getHours())}:${pad2(at.getMinutes())} 기준` : (on ? '지난 값' : '불러오는 중');
  return (
    <div className="mt-2.5 rounded-[1.3rem] border border-white bg-gradient-to-br from-[#EFF8FD] via-[#FBFCF6] to-[#FFF7E9] px-3.5 py-3 shadow-[0_4px_16px_rgba(160,180,190,0.16)]">
      <div className="flex flex-wrap items-center gap-x-2 gap-y-1">
        <span className="text-[20px] leading-none">{icon}</span>
        <span className="text-[15px] font-extrabold text-[#4B423A]">{region} {temp}°</span>
        <span className="text-[12px] font-bold text-[#8E8578]">{sky}</span>
        <span className="text-[10.5px] font-bold text-[#B0A596]">최저 {low}° · 최고 {high}°</span>
        <span className={`ml-auto rounded-full border px-2.5 py-1 text-[10px] font-extrabold ${dustTone(dust)}`}>미세먼지 {dust}</span>
      </div>
      <div className="mt-2 flex items-center justify-between gap-2">
        <span className={`rounded-full border px-2.5 py-1 text-[10px] font-extrabold ${dustTone(dust2)}`}>초미세먼지 {dust2}</span>
        <div className="flex min-w-0 items-center gap-1.5">
          <span className="shrink-0 text-[9px] font-bold text-[#BDB2A2]">{caption}</span>
          <span className="rounded-full border border-[#EFE6D2] bg-white px-2.5 py-1 text-[10px] font-extrabold text-[#8A7C66]">{tip}</span>
        </div>
      </div>
    </div>
  );
}

    setDraft('');
    setInline(null);

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between gap-2 px-1">

        <button onClick={timer.reset} className="flex-1 rounded-2xl py-3 text-[13px] font-extrabold bg-white border border-[#E6ECF4] text-[#5F6E80] press">
          ↺ 초기화
        </button>
      </div>

      <div className="mt-2.5 flex gap-1.5">
        {[10, 20, 30].map((m) => (
          <button
            key={m}
            onClick={() => timer.preset(m)}
            className={`flex-1 rounded-full py-2 text-[11.5px] font-extrabold border press ${
              timer.mode === 'countdown' && timer.minutes === m
                ? 'bg-[#EAF2FD] text-[#3F6E9E] border-[#B9D3F2]'
                : 'bg-white text-[#7B8899] border-[#E4EBF4]'
            }`}
          >
            {m}분
          </button>
        ))}
      </div>

      <div className="mt-2 flex gap-1.5">
        <input
          type="number"
          inputMode="numeric"
          value={custom}
          onChange={(e) => setCustom(e.target.value.replace(/[^0-9]/g, ''))}
          onKeyDown={(e) => {
            if (e.key === 'Enter') {
              const v = timer.applyCustom(custom);
              setCustom('');
              onToast(`⏳ ${v}분으로 맞췄어요`);
            }
          }}
          placeholder="직접"
          className="flex-1 min-w-0 rounded-full border border-[#E1E9F3] bg-white px-3.5 py-2 text-[12px] font-bold text-center text-[#4B423A] placeholder-[#B7C0CC] outline-none focus:border-[#B9D3F2]"
        />
        <button
          onClick={() => {
            if (!custom) { onToast('분을 먼저 적어 주세요'); return; }
            const v = timer.applyCustom(custom);
            setCustom('');
            onToast(`⏳ ${v}분으로 맞췄어요`);
          }}
          className="shrink-0 rounded-full border border-[#DDE7F3] bg-white px-3.5 py-2 text-[11.5px] font-extrabold text-[#5E7F9F] press"
        >
          분 맞추기
        </button>
      </div>
    </div>
  );
}

/* ────────────────────────── 용돈 ────────────────────────── */
function MoneyTab({ state, moneyKid, setMoneyKid, onChangeStart, onAddEntry, onDeleteEntry }) {
  const money = moneyOf(state, moneyKid);
  const [kind, setKind] = useState('입금');
  const [amount, setAmount] = useState('');
  const [memo, setMemo] = useState('');
  const m = M[moneyKid];

  const studyLog = (state.studyLog && state.studyLog[moneyKid]) || {};
  const taskLog = (state.taskLog && state.taskLog[moneyKid]) || {};
  const todayKey = dkey();
  /* 독서·할 일 적립을 합쳐서 날짜별로 보여 준다 */
  const dayOf = (k) => {
    const s = logDay(studyLog, k);
    const t = logDay(taskLog, k);
    return { s, t, total: s.amount + t.amount };
  };
  const days = Array.from(new Set([...Object.keys(studyLog), ...Object.keys(taskLog)]))
    .filter((k) => { const d = dayOf(k); return d.s.count > 0 || d.t.count > 0 || d.total > 0; })
    .sort()
    .reverse();
  const todayLog = dayOf(todayKey);

  const submit = () => {
    const v = num(amount);
    if (!v) return;
    onAddEntry(moneyKid, { kind, amount: v, memo: memo.trim() });
    setAmount('');
    setMemo('');
  };

  return (
    <div className="space-y-3">
      <div className="rounded-[1.8rem] bg-gradient-to-br from-[#FFF7EA] via-[#FFF2EE] to-[#F9F1FB] border border-[#F6E4D8] p-4 shadow-[0_4px_18px_rgba(220,190,170,0.14)]">
        <div className="flex items-center gap-2.5">
          <span className="text-[30px] leading-none">🐷</span>
          <div className="min-w-0">
            <h2 className="text-[18px] font-extrabold text-[#4B423A]">{moneyKid} 용돈기입장</h2>
            <p className="mt-0.5 text-[10px] font-bold text-[#A99A8C] leading-relaxed">독서·할 일을 끝낼 때마다 정한 금액(10원~200원)씩 쌓여요</p>
          </div>
        </div>

        <div className="mt-3">
          <KidSwitch value={moneyKid} onChange={setMoneyKid} chars={state.characters} />
        </div>

        <div className="mt-3.5 flex items-end justify-between gap-2">
          <span className="text-[11.5px] font-extrabold text-[#9A8A72]">지금 모은 돈</span>
          <span className="text-[29px] font-black text-[#6B5433] tracking-tight leading-none">
            {won(money.total)}<span className="text-[14px] font-extrabold">원</span>
          </span>
        </div>

        <div className="mt-2.5 flex flex-wrap gap-1.5">
          <span className="rounded-full bg-white/85 border border-[#EFE2D0] px-2.5 py-1 text-[10px] font-extrabold text-[#8A7A64]">시작 금액 {won(money.start)}원</span>
          <span className="rounded-full bg-white/85 border border-[#EFE2D0] px-2.5 py-1 text-[10px] font-extrabold text-[#C08A3A]">독서 적립 +{won(money.study)}원</span>
          <span className="rounded-full bg-white/85 border border-[#EFE2D0] px-2.5 py-1 text-[10px] font-extrabold text-[#5B7FA8]">할 일 적립 +{won(money.task)}원</span>
          <span className="rounded-full bg-white/85 border border-[#EFE2D0] px-2.5 py-1 text-[10px] font-extrabold text-[#4C8A62]">입금 +{won(money.dep)}원</span>
          <span className="rounded-full bg-white/85 border border-[#EFE2D0] px-2.5 py-1 text-[10px] font-extrabold text-[#C0605C]">사용 -{won(money.use)}원</span>
        </div>

        <div className="mt-3.5 border-t border-dashed border-[#E9DAC5] pt-3">
          <label className="text-[10.5px] font-extrabold text-[#9A8A72]">시작 금액(이미 모아 둔 돈)</label>
          <NumberField
            value={money.start}
            onCommit={(v) => onChangeStart(moneyKid, v)}

          />
        </div>
      </div>

      {/* 입금·사용 기록 */}
      <div className="rounded-[1.6rem] bg-white border border-[#F1E9DA] p-3.5 shadow-sm">
        <h3 className="text-[14.5px] font-extrabold text-[#4B423A] flex items-center gap-1.5">✍️ 입금 · 사용 기록하기</h3>
        <div className="mt-2.5 flex gap-1.5">
          {['입금', '사용'].map((k) => (
            <button
              key={k}
              onClick={() => setKind(k)}
              className={`flex-1 rounded-full py-2 text-[11.5px] font-extrabold border press ${
                kind === k
                  ? (k === '입금' ? 'bg-[#E9F6EC] border-[#C9E8D2] text-[#2E7D46]' : 'bg-[#FDEDEB] border-[#F3D3CE] text-[#B4584D]')
                  : 'bg-white border-[#EDE6D8] text-[#A99B8A]'
              }`}
            >
              {k === '입금' ? '💰 입금' : '🛒 사용'}
            </button>
          ))}

            className="w-[38%] rounded-xl border border-[#EDE6D8] bg-[#FFFDF8] px-3 py-2.5 text-[13px] font-extrabold text-[#4B423A] outline-none focus:border-[#D9C4A5] placeholder-[#BFB2A2]"
          />
          <input
            value={memo}
            onChange={(e) => setMemo(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
            placeholder="무엇에 썼는지 메모"
            className="flex-1 min-w-0 rounded-xl border border-[#EDE6D8] bg-[#FFFDF8] px-3 py-2.5 text-[12px] font-bold text-[#4B423A] outline-none focus:border-[#D9C4A5] placeholder-[#BFB2A2]"
          />
          <button onClick={submit} className="shrink-0 rounded-xl bg-[#4B423A] text-white px-3.5 py-2.5 text-[11.5px] font-extrabold press">기록</button>
        </div>

        {money.entries.length > 0 ? (
          <div className="mt-3 space-y-1.5">
            {money.entries.slice().reverse().map((e) => (
              <div key={e.id} className="flex items-center gap-2 rounded-xl bg-[#FFFDF8] border border-[#F3EBDD] px-2.5 py-2">
                <span className={`shrink-0 rounded-full px-2 py-0.5 text-[9px] font-extrabold ${e.type === '입금' ? 'bg-[#E9F6EC] text-[#2E7D46]' : 'bg-[#FDEDEB] text-[#B4584D]'}`}>{e.type}</span>
                <span className="flex-1 min-w-0 truncate text-[11px] font-bold text-[#6B5B4A]">{e.memo || (e.type === '입금' ? '입금' : '사용')}</span>
                <span className={`shrink-0 text-[11px] font-extrabold ${e.type === '입금' ? 'text-[#3E7B52]' : 'text-[#B4584D]'}`}>
                  {e.type === '입금' ? '+' : '-'}{won(e.amount)}원
                </span>
                <button onClick={() => onDeleteEntry(moneyKid, e.id)} aria-label="기록 삭제" className="shrink-0 h-6 w-6 rounded-full bg-white border border-[#F0E7D8] text-[10px] text-[#C9726C] press">✕</button>
              </div>
            ))}
          </div>
        ) : (
          <p className="mt-2.5 text-center text-[10px] font-bold text-[#B6A996]">아직 기록이 없어요</p>
        )}
      </div>

      {/* 매일 적립 (독서 + 할 일) */}
      <div className="rounded-[1.6rem] bg-white border border-[#F1E9DA] p-3.5 shadow-sm">
        <h3 className="text-[14.5px] font-extrabold text-[#4B423A] flex items-center gap-1.5">📅 매일 적립 (독서 + 할 일)</h3>
        <p className="mt-0.5 text-[10px] font-bold text-[#A99A8C]">하루에 한 줄로 그날 총액을 보여 줘요 · 독서와 할 일을 나눠서 적어요</p>

        <div className="mt-2.5 rounded-2xl bg-[#FFFDF4] border border-[#F1E9D8] px-3 py-2.5 flex items-start justify-between gap-2">
          <div className="min-w-0">
            <div className="flex items-center gap-1.5">
              <span className="text-[11px] font-extrabold text-[#6B5B4A] whitespace-nowrap">{fmtDay(todayKey)}</span>
              <span className="rounded-full bg-[#E9F6EC] text-[#3E7B52] px-1.5 py-0.5 text-[8.5px] font-extrabold">오늘</span>
            </div>
            <div className="mt-0.5 text-[9.5px] font-bold leading-snug text-[#A99B8A]">
              독서 {todayLog.s.count}개 · {won(todayLog.s.amount)}원 / 할 일 {todayLog.t.count}개 · {won(todayLog.t.amount)}원
            </div>
          </div>
          <span className="shrink-0 text-[12px] font-black text-[#C08A3A] whitespace-nowrap">+{won(todayLog.total)}원</span>
        </div>

        {days.filter((k) => k !== todayKey).length > 0 ? (
          <div className="mt-1.5 space-y-1">
            {days.filter((k) => k !== todayKey).slice(0, 6).map((k) => {
              const d = dayOf(k);
              return (
                <div key={k} className="flex items-start justify-between gap-2 px-1 py-1">
                  <div className="min-w-0">
                    <div className="text-[10px] font-bold text-[#A99B8A] whitespace-nowrap">{fmtDay(k)}</div>
                    <div className="mt-0.5 text-[9px] font-bold leading-snug text-[#B3A795]">
                      독서 {d.s.count}개 · {won(d.s.amount)}원 / 할 일 {d.t.count}개 · {won(d.t.amount)}원
                    </div>
                  </div>
                  <span className="shrink-0 text-[10.5px] font-extrabold text-[#C08A3A] whitespace-nowrap">+{won(d.total)}원</span>
                </div>
              );
            })}
          </div>
        ) : (
          <p className="mt-2 text-center text-[10px] font-bold text-[#B6A996]">독서나 할 일을 하나 끝내면 여기에 쌓여요</p>
        )}
      </div>
    </div>
  );
}

            ) : (
              <span className="inline-flex items-center gap-1 rounded-full border border-[#F0E2D2] bg-[#FFF9F0] px-1.5 py-[1px] text-[9px] font-extrabold text-[#9A7A50]">👨‍👩‍👧‍👦 가족</span>
            )}

  return (

        <div className="flex items-start justify-between gap-2">

            <h2 className="text-[16.5px] font-extrabold text-[#4B423A] flex items-center gap-1.5">
              <span>📅</span> 이번 주 가족 일정
            </h2>
            <p className="mt-1 text-[10px] font-bold leading-relaxed text-[#A99A8C]">{range} · 약속과 일정을 한눈에 봐요</p>
          </div>
          <button
            onClick={() => onAdd(null)}
            className="shrink-0 rounded-full bg-white border border-[#F0E4CF] shadow-sm px-3 py-2 text-[11px] font-extrabold text-[#8A6C4A] press whitespace-nowrap"
          >
            + 일정 추가
          </button>
        </div>

        <div className="mt-3 flex flex-wrap gap-1.5">
          <button
            onClick={() => setFilter('전체')}
            aria-pressed={filter === '전체'}
            className={`shrink-0 rounded-full px-2.5 py-1 text-[10.5px] font-extrabold border press ${
              filter === '전체' ? 'bg-[#FFF0C9] border-[#EFD89A] text-[#A87F2C]' : 'bg-white border-[#EDE3D2] text-[#A99B8A]'
            }`}
          >
            전체
          </button>
          <button
            onClick={() => setFilter(FAMILY_WHO)}
            aria-pressed={filter === FAMILY_WHO}
            className={`shrink-0 rounded-full px-2.5 py-1 text-[10.5px] font-extrabold border press ${
              filter === FAMILY_WHO ? 'bg-[#FFF0C9] border-[#EFD89A] text-[#A87F2C]' : 'bg-white border-[#EDE3D2] text-[#A99B8A]'
            }`}
          >
            가족
          </button>
          {MEMBERS.map((m) => (
            <button
              key={m.id}
              onClick={() => setFilter(m.id)}
              aria-label={`${m.name} 일정만 보기`}
              aria-pressed={filter === m.id}
              className={`shrink-0 rounded-full pl-1 pr-2 py-1 text-[10.5px] font-extrabold border flex items-center gap-0.5 press ${
                filter === m.id ? 'bg-[#FFF0C9] border-[#EFD89A] text-[#4B423A] shadow-sm' : 'bg-white border-[#EDE3D2] text-[#A99B8A]'
              }`}
            >
              <Ava id={m.id} chars={state.characters} size={18} />{m.name}

        <div className="mt-2 flex items-center gap-1.5">
          <span className="rounded-full bg-white/85 border border-[#EFE2D0] px-2.5 py-1 text-[9.5px] font-extrabold text-[#8A7A64]">

          </span>

      {/* 요일별 카드 */}
      {week.map((d, i) => {
        const items = shown
          .filter((it) => it.day === i)
          .slice()
          .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
        const isToday = dkey(d) === todayKey;
        const labelColor = isToday ? 'text-[#A9791F]' : i === 5 ? 'text-[#5B7FA8]' : i === 6 ? 'text-[#C0605C]' : 'text-[#6B5B4A]';
        return (
          <div
            key={SCHED_DAYS[i].key}
            className={`rounded-[1.5rem] border p-3 ${
              isToday
                ? 'bg-[#FFFDF4] border-[#F2C879] shadow-[0_4px_16px_rgba(235,185,90,0.22)]'
                : 'bg-white border-[#F1E9DA] shadow-[0_3px_14px_rgba(180,160,140,0.08)]'
            }`}
          >

              <div className="flex items-center gap-1.5 min-w-0">
                <span className={`text-[13px] font-extrabold ${labelColor}`}>{SCHED_DAYS[i].label}</span>
                <span className="text-[10.5px] font-bold tabular-nums text-[#A99B8A]">{d.getMonth() + 1}/{d.getDate()}</span>
                {isToday ? (
                  <span className="rounded-full bg-[#FFE7B0] border border-[#F0C274] px-1.5 py-[1px] text-[8.5px] font-extrabold text-[#9A6A18]">오늘</span>

                  onClick={() => onAdd(i)}

                >

                </button>
              </div>
            </div>

            <div className="mt-1">
              {items.length === 0 ? (
                <p className="py-1 text-[10px] font-bold text-[#C0B4A4]">일정이 없어요</p>
              ) : (
                items.map((it, k) => itemRow(it, k > 0))
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ────────────────────────── 채팅 ────────────────────────── */
function ChatTab({ state, chatAs, setChatAs, locked, onSend, onHeart, onDelete, onToggleLock, onToast }) {
  const [draft, setDraft] = useState('');
  const [picker, setPicker] = useState(null);
  const listRef = useRef(null);

  useEffect(() => {
    const el = listRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [state.chats.length, chatAs]);

  const send = (text, type, sticker) => {
    if (locked) { onToast('🔒 이 기기가 잠겨 있어요. 잠금을 풀어 주세요'); return; }
    if (!text || !text.trim()) return;
    onSend(text, type || 'text', sticker || null);
    setDraft('');
    setPicker(null);
  };

  let lastDay = null;

  return (
    <div className="flex-1 min-h-0 flex flex-col">
      <div className="flex-none px-4 pb-2">
        <div className="flex items-start justify-between gap-2">
          <div className="min-w-0">
            <h2 className="text-[19px] font-extrabold text-[#4B423A] flex items-center gap-1.5">
              <span>💬</span> 우리 가족 채팅
            </h2>
            <p className="mt-1 text-[10px] font-bold leading-relaxed text-[#A99A8C]">
              가족이 말풍선과 스티커로 이야기해요 · 가족 모두에게 바로 보여요
            </p>
          </div>
          <button
            onClick={onToggleLock}
            className={`shrink-0 rounded-full border px-2.5 py-2 text-[10px] font-extrabold press whitespace-nowrap ${
              locked ? 'bg-[#FDEBEB] border-[#F3D2CE] text-[#B4584D]' : 'bg-white border-[#EFE6D6] text-[#8A7C66]'
            }`}
          >
            {locked ? '🔓 잠금 해제' : '🔒 이 기기 잠금'}
          </button>
        </div>

        <div className="mt-2 flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
          {MEMBERS.map((m) => (
            <button
              key={m.id}
              onClick={() => setChatAs(m.id)}
              className={`shrink-0 flex items-center gap-1 rounded-full pl-1.5 pr-2.5 py-1 border press ${
                chatAs === m.id ? 'bg-white border-[#B9D3F2] shadow-[0_2px_8px_rgba(150,180,215,.2)]' : 'bg-white/60 border-white/80'
              }`}
            >
              <span className="text-[15px] leading-none"><Ava id={m.id} chars={state.characters} size={21} /></span>
              <span className={`text-[10.5px] font-extrabold ${chatAs === m.id ? 'text-[#4B423A]' : 'text-[#A99B8A]'}`}>{m.name}</span>
            </button>
          ))}
        </div>
      </div>

      <div ref={listRef} className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-4 pt-2 pb-2">
        {state.chats.length === 0 ? (
          <div className="mt-10 text-center">
            <div className="text-[34px]">💌</div>
            <p className="mt-2 text-[11.5px] font-bold text-[#B0A392]">아직 대화가 없어요. 먼저 말을 걸어 볼까요?</p>
          </div>
        ) : null}

        {state.chats.map((c) => {
          const day = dkey(new Date(c.time));
          const showDay = day !== lastDay;
          lastDay = day;
          const mine = c.from === chatAs;
          const who = M[c.from] || MEMBERS[0];
          return (
            <div key={c.id}>
              {showDay ? (
                <div className="my-2 text-center">
                  <span className="rounded-full bg-white/80 border border-[#EFE6D6] px-2.5 py-1 text-[9px] font-extrabold text-[#A79B8B]">
                    {day === dkey() ? '오늘' : fmtDay(day)}
                  </span>
                </div>
              ) : null}

              <div className={`flex items-end gap-1.5 mt-1.5 ${mine ? 'justify-end' : 'justify-start'}`}>
                {!mine ? (
                  <Ava id={c.from} chars={state.characters} size={30} card className="mb-[26px] rounded-[0.7rem]" />
                ) : null}

                <div className={`max-w-[76%] ${mine ? 'items-end' : 'items-start'} flex flex-col`}>
                  {!mine ? (
                    <div className="mb-0.5 px-1 flex items-center gap-1.5">
                      <span className="text-[9.5px] font-extrabold text-[#8A7C66]">{who.name}</span>
                      <span className="text-[8.5px] font-bold text-[#BCAE9C]">{fmtTime(c.time)}</span>
                    </div>
                  ) : null}

                  {stickerOf(c.sticker) ? (
                    <StickerCard sticker={stickerOf(c.sticker)} size={132} />
                  ) : (
                    <div
                      className={`px-3 py-2 rounded-[1.1rem] border shadow-sm ${
                        c.type === 'sticker'
                          ? 'bg-transparent border-0 shadow-none text-[46px] leading-none px-0 py-0'
                          : mine
                            ? 'bg-[#F3F8FE] border-[#DCE9F8] text-[#3F4A57]'
                            : 'bg-white border-[#F1E8D8] text-[#3F4A57]'
                      }`}
                    >
                      <span className={`${c.type === 'sticker' ? '' : 'text-[12px] font-semibold leading-relaxed'} whitespace-pre-wrap break-words`}>{c.text}</span>
                    </div>
                  )}

                  <div className={`mt-1 flex items-center gap-1 ${mine ? 'justify-end pr-0.5' : 'pl-0.5'}`}>
                    {mine ? <span className="text-[8.5px] font-bold text-[#BCAE9C] mr-0.5">{fmtTime(c.time)}</span> : null}
                    <button
                      onClick={() => onHeart(c.id)}
                      className={`h-6 px-2 rounded-full border text-[10px] press ${c.heart ? 'bg-[#FFF0F1] border-[#F6D3D6] text-[#D9535C]' : 'bg-white border-[#F0E7D8] text-[#B5A896]'}`}
                    >
                      {c.heart ? '❤️' : '🤍'}
                    </button>
                    <button onClick={() => onDelete(c.id)} aria-label="메시지 삭제" className="h-6 w-6 rounded-full border border-[#F0E7D8] bg-white text-[10px] text-[#C0938E] press">✕</button>
                  </div>
                </div>

                {mine ? (
                  <Ava id={c.from} chars={state.characters} size={30} card className="mb-[26px] rounded-[0.7rem]" />
                ) : null}
              </div>
            </div>
          );
        })}
      </div>

      {locked ? (
        <div className="flex-none px-4 pb-2">
          <div className="rounded-[1.2rem] border border-[#F3D2CE] bg-[#FFF5F4] px-3.5 py-3 flex items-center justify-between gap-2">
            <div className="min-w-0">
              <p className="text-[11.5px] font-extrabold text-[#B4584D]">🔒 이 기기 잠금 중</p>
              <p className="text-[9.5px] font-bold text-[#C39A96]">잠금을 풀어야 메시지를 보낼 수 있어요</p>
            </div>
            <button onClick={onToggleLock} className="shrink-0 rounded-full bg-[#4B423A] text-white px-3 py-2 text-[10.5px] font-extrabold press">잠금 해제</button>
          </div>
        </div>
      ) : (
        <div className="flex-none px-4 pb-2">
          {picker === 'emoji' || picker === 'sticker' ? (
            <div className="mb-1.5 rounded-[1.2rem] border border-[#EFE6D6] bg-white/95 p-2 pop-in">
              <div className="flex gap-1 mb-1.5">
                <button
                  onClick={() => setPicker('emoji')}
                  className={`flex-1 rounded-full py-1 text-[10px] font-extrabold ${picker === 'emoji' ? 'bg-[#FFF3D6] text-[#A97C25]' : 'text-[#A99B8A]'}`}
                >
                  😊 이모지
                </button>
                <button
                  onClick={() => setPicker('sticker')}
                  className={`flex-1 rounded-full py-1 text-[10px] font-extrabold ${picker === 'sticker' ? 'bg-[#FFF3D6] text-[#A97C25]' : 'text-[#A99B8A]'}`}
                >
                  🧸 스티커
                </button>
              </div>
              {picker === 'emoji' ? (
                <div className="grid grid-cols-6 gap-1">
                  {EMOJIS.map((e) => (
                    <button
                      key={e}
                      onClick={() => setDraft((d) => d + e)}
                      className="rounded-xl py-2 text-[20px] press"
                    >
                      {e}
                    </button>
                  ))}
                </div>
              ) : (
                <div className="grid grid-cols-3 gap-1.5">
                  {CHAT_STICKERS.map((st) => (
                    <button
                      key={st.id}
                      onClick={() => send(st.label, 'sticker', st.id)}
                      aria-label={st.label}
                      title={st.label}
                      className="rounded-2xl border border-[#F2E7D4] bg-[#FFFBF0] py-1.5 flex flex-col items-center press"
                    >
                      <ChiikawaAvatar id={st.char} size={58} mood={st.mood} />
                      <span className="mt-0.5 w-full px-0.5 text-center text-[8.5px] font-extrabold leading-tight text-[#A87A24]">{st.short || st.label}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          ) : null}

          <div className="flex items-end gap-1.5 rounded-full border border-[#EDE3D2] bg-white px-1.5 py-1 shadow-[0_2px_10px_rgba(180,160,140,0.12)]">
            <button
              onClick={() => setPicker(picker ? null : 'emoji')}
              aria-label="이모지"
              className="shrink-0 h-8 w-8 rounded-full bg-[#FFF7E6] border border-[#F1E4C8] text-[15px] press"
            >
              😊
            </button>
            <input
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              onKeyDown={(e) => { if (e.key === 'Enter') send(draft); }}
              placeholder={`${chatAs}로 보낼 메시지`}
              className="flex-1 min-w-0 bg-transparent py-2 text-[12.5px] font-semibold text-[#4B423A] outline-none placeholder-[#BFB2A2]"
            />
            <button
              onClick={() => send(draft)}
              className="shrink-0 h-8 px-3 rounded-full bg-[#F2C46B] text-[#5C4517] text-[11px] font-extrabold press"
            >
              보내기
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ────────────────────────── 도장판 달력 ────────────────────────── */
function StampCalendar({ kid, stamps, onToggle, chars }) {
  const today = new Date();
  const [cursor, setCursor] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const y = cursor.getFullYear();
  const mo = cursor.getMonth();
  const firstIdx = new Date(y, mo, 1).getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const cells = [...Array(firstIdx).fill(null), ...Array.from({ length: days }, (_, i) => new Date(y, mo, i + 1))];
  const mk = `${y}-${pad2(mo + 1)}`;
  const monthStamps = stamps.filter((k) => k.slice(0, 7) === mk);

  return (
    <div>
      <div className="flex items-center justify-between">
        <button onClick={() => setCursor(new Date(y, mo - 1, 1))} className="h-8 w-8 rounded-full bg-white border border-[#EFE6D6] text-[12px] text-[#8A7C66] press">‹</button>
        <div className="text-center">
          <div className="text-[13.5px] font-extrabold text-[#4B423A]">{y}년 {mo + 1}월</div>
          <div className="text-[9.5px] font-extrabold text-[#B08A55]">이번 달 도장 {monthStamps.length}개</div>
        </div>
        <button onClick={() => setCursor(new Date(y, mo + 1, 1))} className="h-8 w-8 rounded-full bg-white border border-[#EFE6D6] text-[12px] text-[#8A7C66] press">›</button>
      </div>

      <div className="mt-3 grid grid-cols-7 gap-1">
        {WEEK.map((w, i) => (
          <div key={w} className={`text-center text-[9.5px] font-extrabold pb-1 ${i === 0 ? 'text-[#D08A8A]' : i === 6 ? 'text-[#7E9BC4]' : 'text-[#B3A695]'}`}>{w}</div>
        ))}
        {cells.map((d, i) => {
          if (!d) return <div key={`e${i}`} />;
          const k = dkey(d);
          const on = stamps.includes(k);
          const isToday = k === dkey();
          const future = d > today;
          return (
            <button
              key={k}
              disabled={future}
              onClick={() => onToggle(kid, k)}
              className={`relative aspect-square rounded-[0.9rem] flex flex-col items-center justify-center border press ${
                on ? 'bg-white border-[#B9D3F2]' : 'bg-[#FFFDF6] border-[#F1E9DA]'
              } ${isToday ? 'ring-2 ring-[#FFE1A8]' : ''} ${future ? 'opacity-40' : ''}`}
            >
              <span className={`text-[8.5px] font-extrabold ${on ? 'text-[#7E9BC4]' : 'text-[#C2B5A3]'}`}>{d.getDate()}</span>
              <span className="leading-none flex items-center justify-center h-[18px]">{on ? <Ava id={kid} chars={chars} size={18} /> : ''}</span>
              {!on ? <span className="absolute inset-x-2.5 bottom-2 border-b border-dashed border-[#EADFCB]"></span> : null}
            </button>
          );
        })}
      </div>
      <p className="mt-3 text-center text-[9.5px] font-bold text-[#B3A695] leading-relaxed">
        날짜를 눌러 도장을 찍거나 지울 수 있어요<br />독서·할 일을 하나 마치면 오늘 도장이 자동으로 찍혀요
      </p>
    </div>
  );
}

/* ────────────────────────── 시트(모달)들 ────────────────────────── */
function TaskSheet({ open, mode, initialOwner, initialText, initialReward, onClose, onSave, chars }) {
  const [owner, setOwner] = useState(initialOwner || '승우');
  const [text, setText] = useState(initialText || '');
  const [reward, setReward] = useState(initialReward == null ? 100 : initialReward);

  useEffect(() => {
    if (open) {
      setOwner(initialOwner || '승우');
      setText(initialText || '');
      setReward(initialReward == null ? 100 : initialReward);
    }
  }, [open, initialOwner, initialText, initialReward]);

  if (!open) return null;
  const save = () => {
    if (!text.trim()) return;
    onSave({ owner, text: text.trim(), reward: num(reward) });
  };

  return (
    <Sheet title={mode === 'edit' ? '할 일 수정' : '할 일 추가'} subtitle="누구의 할 일인지 고르고 내용을 적어 주세요" onClose={onClose}>
      <div className="space-y-3">
        <div>
          <p className="mb-1.5 text-[10.5px] font-extrabold text-[#9A8A72]">누구의 할 일인가요?</p>
          <div className="flex flex-wrap gap-1.5">
            {MEMBERS.map((m) => (
              <button
                key={m.id}
                onClick={() => setOwner(m.id)}
                className={`flex items-center gap-1 rounded-full pl-1.5 pr-3 py-1.5 border text-[11.5px] font-extrabold press ${
                  owner === m.id ? 'bg-white border-[#D9C4A5] text-[#4B423A] shadow-sm' : 'bg-white/60 border-[#EDE3D2] text-[#A99B8A]'
                }`}
              >
                <Ava id={m.id} chars={chars} size={21} />{m.name}
              </button>
            ))}
          </div>
        </div>

        <div>
          <p className="mb-1.5 text-[10.5px] font-extrabold text-[#9A8A72]">할 일</p>
          <input
            autoFocus
            value={text}
            onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') save(); }}
            placeholder="예) 수학 문제집 3장 풀기"
            className="w-full rounded-xl border border-[#EADFCB] bg-white px-3.5 py-2.5 text-[12.5px] font-bold text-[#4B423A] outline-none focus:border-[#D9C4A5] placeholder-[#BFB2A2]"
          />
        </div>

        <div>

function App() {
  const [state, setState] = useState(loadState);
  const stateRef = useRef(state);
  stateRef.current = state;
  const sync = useFamilySync(state, setState, stateRef);
  const [device, setDevice] = useState(loadDevice);
  const [tab, setTab] = useState('home');
  const [stampKid, setStampKid] = useState('승우');
  const [moneyKid, setMoneyKid] = useState('승우');
  const [studyFilter, setStudyFilter] = useState('전체');
  const [scheduleFilter, setScheduleFilter] = useState('전체');
  const [sheet, setSheet] = useState(null);
  /* 설정에서 캐릭터를 바꾸는 가족 (시트에서 고른다) */
  const [charFor, setCharFor] = useState('승우');
  const [taskModal, setTaskModal] = useState(null);
  const [studyModal, setStudyModal] = useState(null);
  const [scheduleModal, setScheduleModal] = useState(null);
  const [toast, setToast] = useState(null);
  const timer = useTimer();
  /* 의령군 날씨·미세먼지는 서버가 아니라 Open-Meteo에서 직접 받아 온다 (가족 기록에는 넣지 않음) */
  const weather = useLiveWeather();
  const scrollRef = useRef(null);
  /* 채팅 이름과 '이 기기 잠금'은 이 기기에만 남는다 */
  const chatAs = device.chatAs || '엄마';
  const setChatAs = (v) => setDevice((d) => ({ ...d, chatAs: v }));
  const chatLocked = !!device.chatLocked;

  useEffect(() => {
    const el = scrollRef.current;
    if (el) el.scrollTop = 0;
  }, [tab]);

  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => { saveDevice(device); }, [device]);

  /* 고정 항목은 매일 아침 다시 열린다 */
  useEffect(() => {
    setState((s) => rolloverState(s));
  }, []);

  const showToast = (msg, undo) => setToast({ id: Date.now(), msg, undo });
  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(null), 3400);
    return () => clearTimeout(id);
  }, [toast]);

  const stampToday = (s, owner) => {
    if (!M[owner] || !M[owner].kid) return s.stamps;
    const list = s.stamps[owner] || [];
    const k = dkey();
    if (list.includes(k)) return s.stamps;
    return { ...s.stamps, [owner]: [...list, k] };
  };

  /* ── 할 일 ── */
  const toggleTask = (id) => {
    const target = (stateRef.current.tasks || []).find((t) => t.id === id);
    const nowDone = !!(target && !target.completed);
    const kid = target && M[target.owner] && M[target.owner].kid;
    const reward = target ? num(target.reward) : 0;

    setState((s) => {
      const tasks = s.tasks.map((t) => (t.id === id ? { ...t, completed: nowDone } : t));
      let stamps = s.stamps;
      let taskLog = s.taskLog || {};
      /* 아이의 할 일에 보상이 있으면 독서와 똑같이 그날 적립에 더하고, 풀면 빼 준다 */
      if (target && kid && reward > 0) {
        const k = dkey();
        const cur = (taskLog[target.owner] && taskLog[target.owner][k]) || { amount: 0, count: 0 };
        const nextDay = {
          amount: Math.max(0, num(cur.amount) + (nowDone ? reward : -reward)),
          count: Math.max(0, num(cur.count) + (nowDone ? 1 : -1)),
        };
        taskLog = { ...taskLog, [target.owner]: { ...(taskLog[target.owner] || {}), [k]: nextDay } };
      }
      if (target && nowDone) stamps = stampToday(s, target.owner);
      return { ...s, tasks, taskLog, stamps };
    });

    if (target && kid && reward > 0) {
      showToast(nowDone
        ? `🪙 ${target.owner} 용돈 ${won(reward)}원 적립!`
        : `${target.owner} 적립 ${won(reward)}원을 되돌렸어요`);
    }
  };

  const addTask = (owner, text, reward) => {
    setState((s) => ({ ...s, tasks: [...s.tasks, { id: uid('t'), owner, text, reward: num(reward), completed: false }] }));
    showToast('할 일을 추가했어요');
  };

  const saveTaskFromSheet = (payload, mode, id) => {
    if (mode === 'edit' && id) {
      setState((s) => ({ ...s, tasks: s.tasks.map((t) => (t.id === id ? { ...t, ...payload } : t)) }));
      showToast('할 일을 수정했어요');
    } else {
      addTask(payload.owner, payload.text, payload.reward);
    }
    setTaskModal(null);
  };

  const deleteTask = (t) => {
    const backup = clone(state.tasks);
    setState((s) => ({ ...s, tasks: s.tasks.filter((x) => x.id !== t.id) }));
    showToast('할 일을 지웠어요', () => setState((s) => ({ ...s, tasks: backup })));
  };

  /* ── 독서 ── */
  const toggleStudy = (item) => {
    setState((s) => {
      const nowDone = !item.done;
      const study = s.study.map((x) => (x.id === item.id ? { ...x, done: nowDone } : x));
      let studyLog = s.studyLog || {};
      let stamps = s.stamps;
      const kid = M[item.owner] && M[item.owner].kid;
      if (kid && num(item.reward) > 0) {
        const k = dkey();
        const cur = (studyLog[item.owner] && studyLog[item.owner][k]) || { amount: 0, count: 0 };
        const nextDay = {
          amount: Math.max(0, num(cur.amount) + (nowDone ? num(item.reward) : -num(item.reward))),
          count: Math.max(0, num(cur.count) + (nowDone ? 1 : -1)),
        };
        studyLog = { ...studyLog, [item.owner]: { ...(studyLog[item.owner] || {}), [k]: nextDay } };
      }
      if (nowDone && kid) stamps = stampToday(s, item.owner);
      return { ...s, study, studyLog, stamps };
    });
  };

  const pinStudy = (item) => {
    setState((s) => ({ ...s, study: s.study.map((x) => (x.id === item.id ? { ...x, pinned: !x.pinned } : x)) }));
    showToast(item.pinned ? '고정 항목에서 뺐어요' : '📌 고정 항목으로 두었어요');
  };

  const saveStudyFromSheet = (payload, mode, id) => {
    if (mode === 'edit' && id) {
      setState((s) => ({ ...s, study: s.study.map((x) => (x.id === id ? { ...x, ...payload } : x)) }));
      showToast('독서 항목을 수정했어요');
    } else {
      setState((s) => ({ ...s, study: [...s.study, { id: uid('st'), done: false, ...payload }] }));
      showToast('독서 항목을 추가했어요');
    }
    setStudyModal(null);
  };

  const deleteStudy = (item) => {
    const backup = clone(state.study);
    setState((s) => ({ ...s, study: s.study.filter((x) => x.id !== item.id) }));
    showToast('독서 항목을 지웠어요', () => setState((s) => ({ ...s, study: backup })));
  };

  /* ── 일정 ── */
  const saveScheduleFromSheet = (payload, mode, id) => {
    if (mode === 'edit' && id) {
      setState((s) => ({ ...s, schedules: (s.schedules || []).map((x) => (x.id === id ? { ...x, ...payload } : x)) }));
      showToast('일정을 수정했어요');
    } else {
      setState((s) => ({ ...s, schedules: [...(s.schedules || []), { id: uid('sc'), ...payload }] }));
      showToast(`📅 ${SCHED_DAYS[payload.day].label}요일 일정을 추가했어요`);
    }
    setScheduleModal(null);
  };

  const deleteSchedule = (item) => {
    const backup = clone(state.schedules || []);
    setState((s) => ({ ...s, schedules: (s.schedules || []).filter((x) => x.id !== item.id) }));
    showToast('일정을 지웠어요', () => setState((s) => ({ ...s, schedules: backup })));
  };

  /* ── 도장 ── */
  const toggleStamp = (kid, k) => {
    setState((s) => {
      const list = s.stamps[kid] || [];
      const next = list.includes(k) ? list.filter((x) => x !== k) : [...list, k];
      return { ...s, stamps: { ...s.stamps, [kid]: next } };
    });
  };

  /* ── 미션 ── */
  const toggleMission = () => {
    setState((s) => {
      const today = dkey();
      const done = s.mission.doneDate === today;
      return { ...s, mission: { ...s.mission, doneDate: done ? null : today, count: Math.max(0, (s.mission.count || 0) + (done ? -1 : 1)) } };
    });
    const done = state.mission.doneDate === dkey();
    showToast(done ? '오늘의 미션을 취소했어요' : '🎉 다 같이 해냈어요! 함께 횟수가 올라갔어요');
  };

  const drawMission = () => {
    setState((s) => {
      let next = s.mission.idx;
      let guard = 0;
      while (next === s.mission.idx && guard < 30) { next = Math.floor(Math.random() * MISSIONS.length); guard++; }
      return { ...s, mission: { ...s.mission, idx: next, doneDate: null } };
    });
    showToast('🔄 새로운 가족 미션을 뽑았어요');
  };

  const pickMission = (idx) => {
    setState((s) => ({ ...s, mission: { ...s.mission, idx, doneDate: null } }));
    setSheet(null);
    showToast('오늘의 가족 미션을 바꿨어요');
  };

  /* ── 용돈 ── */
  const onChangeStart = (kid, v) => {
    setState((s) => ({ ...s, money: { ...s.money, [kid]: { ...(s.money[kid] || { entries: [] }), start: num(v) } } }));
  };
  const onAddEntry = (kid, e) => {
    setState((s) => {

                    >

                  showToast('오늘 독서 체크를 모두 풀었어요');
                }}
                className="w-full rounded-2xl bg-white border border-[#EDE3D2] py-3 text-[12px] font-extrabold text-[#8A7C66] press"
              >
                ↺ 오늘 체크 모두 풀기
              </button>
            }
          >
            <div className="space-y-2">
              {MEMBERS.map((m) => {
                const items = state.study.filter((s) => s.owner === m.id);
                if (items.length === 0) return null;
                return (
                  <div key={m.id} className="rounded-[1.2rem] border border-[#F1E9DA] bg-white p-2.5">
                    <p className="text-[10.5px] font-extrabold text-[#8A7A64] flex items-center gap-1">
                      <Ava id={m.id} chars={state.characters} size={18} />{m.name}
                    </p>
                    <div className="mt-1.5 space-y-1">
                      {items.map((s) => (
                        <button
                          key={s.id}
                          onClick={() => pinStudy(s)}
                          className={`w-full flex items-center gap-2 rounded-xl border px-2.5 py-2 text-left press ${
                            s.pinned ? 'bg-[#FFF8E2] border-[#F0DCA8]' : 'bg-[#FFFDF8] border-[#F3EBDD]'
                          }`}
                        >
                          <span className="text-[12px]">📌</span>
                          <span className={`flex-1 min-w-0 text-[11px] font-bold truncate ${s.pinned ? 'text-[#4B423A]' : 'text-[#B0A392]'}`}>{s.text}</span>
                          <span className={`h-4 w-8 rounded-full p-0.5 transition ${s.pinned ? 'bg-[#F0C96A]' : 'bg-[#E4E7EC]'}`}>
                            <span className={`block h-3 w-3 rounded-full bg-white transition ${s.pinned ? 'translate-x-4' : ''}`}></span>
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </Sheet>
        ) : null}

        <TaskSheet
          chars={state.characters}
          open={!!taskModal}
          mode={taskModal ? taskModal.mode : 'add'}
          initialOwner={taskModal && taskModal.task ? taskModal.task.owner : (taskModal ? taskModal.owner : '승우')}
          initialText={taskModal && taskModal.task ? taskModal.task.text : (taskModal ? taskModal.text : '')}
          initialReward={taskModal && taskModal.task ? taskModal.task.reward : (taskModal ? taskModal.reward : 100)}
          onClose={() => setTaskModal(null)}
          onSave={(payload) => saveTaskFromSheet(payload, taskModal ? taskModal.mode : 'add', taskModal && taskModal.task ? taskModal.task.id : null)}
        />

        <StudySheet
          chars={state.characters}
          open={!!studyModal}
          mode={studyModal ? studyModal.mode : 'add'}
          initial={studyModal ? studyModal.initial : null}
          onClose={() => setStudyModal(null)}
          onSave={(payload) => saveStudyFromSheet(payload, studyModal ? studyModal.mode : 'add', studyModal && studyModal.initial ? studyModal.initial.id : null)}
        />

        <ScheduleSheet
          chars={state.characters}
          open={!!scheduleModal}
          mode={scheduleModal ? scheduleModal.mode : 'add'}
          initial={scheduleModal ? scheduleModal.item : null}
          initialDay={scheduleModal ? scheduleModal.day : null}
          onClose={() => setScheduleModal(null)}
          onSave={(payload) => saveScheduleFromSheet(payload, scheduleModal ? scheduleModal.mode : 'add', scheduleModal && scheduleModal.item ? scheduleModal.item.id : null)}
        />
      </div>
    </div>
  );
}

function ResetButton({ onReset }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => {
    if (!armed) return;
    const id = setTimeout(() => setArmed(false), 5000);
    return () => clearTimeout(id);
  }, [armed]);
  if (!armed) {
    return (
      <button onClick={() => setArmed(true)} className="flex-1 rounded-xl bg-[#FDF1EF] border border-[#F2D8D3] py-2.5 text-[11px] font-extrabold text-[#B4584D] press">
        🧹 전체 초기화
      </button>
    );
  }
  return (
    <button onClick={onReset} className="flex-1 rounded-xl bg-[#C9605A] border border-[#B8544F] py-2.5 text-[11px] font-extrabold text-white press">
      정말 초기화할까요? (가족 전체)
    </button>
  );
}

const SHOW_GALLERY = window.location.search.indexOf('gallery=1') >= 0;
ReactDOM.createRoot(document.getElementById('root')).render(SHOW_GALLERY ? <CharacterGallery /> : <App />);
</script>
</body>
</html>
